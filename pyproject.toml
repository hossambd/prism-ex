[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "prism-ex"
version = "0.1.0"
description = "Strict FCS 3.1 ingestion, community detection, marker comparison and partition stability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hossam Boudraa" }]
keywords = ["flow-cytometry", "fcs", "community-detection", "leiden", "stability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Lower bounds are the oldest release whose API this code uses; upper bounds stop
# at the next major, because a major version is where these projects break things.
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "python-igraph>=0.10,<2",
    "leidenalg>=0.10,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "python-multipart>=0.0.9"]
pandas = ["pandas>=2.0,<3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "flowio>=1.3",          # differential oracle for the reader; see tests/test_fcs_oracle.py
    "httpx2>=2.0,<3",       # Starlette TestClient
    "build>=1.2",
]

[project.scripts]
prism-ex = "prism_ex.cli:main"

[project.urls]
Homepage = "https://github.com/hossambd/prism-ex"

[tool.hatch.build.targets.wheel]
packages = ["src/prism_ex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: resampling-heavy tests, deselect with -m 'not slow'"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]   # FastAPI dependency defaults are function calls by design

[tool.coverage.run]
source = ["prism_ex"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
